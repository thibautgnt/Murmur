name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Draft release (hidden from the in-app updater)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Download the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache whisper.cpp
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: whisper-${{ runner.os }}-${{ hashFiles('Makefile') }}-${{ github.run_id }}
          restore-keys: whisper-${{ runner.os }}-${{ hashFiles('Makefile') }}-

      - name: Build Murmur.zip
        run: make dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make publish ${{ inputs.draft && 'DRAFT=1' || '' }}
