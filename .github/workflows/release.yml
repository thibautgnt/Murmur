name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: Draft release (hidden from the in-app updater)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v4

      - name: Repository checks
        run: python3 scripts/check-murmur.py

      - name: No open CodeQL alert of high severity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALERTS=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&per_page=100" --paginate \
            -q '.[] | select(.rule.security_severity_level == "critical" or .rule.security_severity_level == "high") | "\(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"')
          if [ -n "$ALERTS" ]; then
            echo "Open CodeQL alerts block the release:"
            echo "$ALERTS"
            exit 1
          fi
          echo "No blocking CodeQL alert"

  test:
    name: Unit tests
    needs: inspect
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - run: make test

  build:
    name: Build Murmur.zip
    needs: inspect
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Import the Developer ID certificate and notarization credentials
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          : "${P12:?DEVELOPER_ID_P12 secret missing}" "${P12_PASSWORD:?DEVELOPER_ID_P12_PASSWORD secret missing}"
          : "${NOTARY_APPLE_ID:?NOTARY_APPLE_ID secret missing}" "${NOTARY_PASSWORD:?NOTARY_PASSWORD secret missing}"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials Murmur-Notarization --keychain "$KEYCHAIN" \
            --apple-id "$NOTARY_APPLE_ID" --team-id 33MB9HPP65 --password "$NOTARY_PASSWORD"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - run: make dist
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: murmur
          path: |
            .local-build/Murmur.zip
            .local-build/VERSION
          retention-days: 7

  publish:
    name: Publish
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: murmur
          path: .local-build
      # A pushed tag already exists, so the release only attaches to it; "-rc" tags make drafts for trial runs.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ (inputs.draft || contains(github.ref_name, '-rc')) && '1' || '' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            make publish TAG="$GITHUB_REF_NAME" DRAFT="$DRAFT"
          else
            make publish DRAFT="$DRAFT"
          fi
