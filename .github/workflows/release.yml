name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Draft release (hidden from the in-app updater)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Build and publish
    needs: ci
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      - name: Build Murmur.zip
        run: make dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make publish ${{ inputs.draft && 'DRAFT=1' || '' }}
