name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Swift is not analyzed: under the CodeQL tracer, Xcode 26 cannot find the Metal toolchain that mlx-swift needs.
jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: actions
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:actions
