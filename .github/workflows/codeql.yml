name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: swift
            build-mode: manual
    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'swift'
        uses: ./.github/actions/setup-build

      # Metal shaders fail to compile under the CodeQL tracer, so packages are built before tracing starts.
      - if: matrix.language == 'swift'
        name: Build dependencies without tracing
        run: make codeql-build

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - if: matrix.language == 'swift'
        name: Build Murmur for analysis
        run: |
          rm -rf .codeql-build/Build/Intermediates.noindex/VoiceInk.build
          make codeql-build

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
